name: Build testing Flatpak

on:
  push:
    branches: ['testing/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-dbus python3-gi dbus-x11 appstream desktop-file-utils
      - name: Controller and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -m unittest discover -v
      - name: Real D-Bus wire test with a simulated service
        env:
          QT_QPA_PLATFORM: offscreen
        run: dbus-run-session -- /usr/bin/python3 scripts/test_dbus_wire.py
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.AUSSIEbattler96_AI.Periphera.desktop
          appstreamcli validate --no-net packaging/io.github.AUSSIEbattler96_AI.Periphera.metainfo.xml
          python3 scripts/prepare_testing.py
          desktop-file-validate packaging/io.github.AUSSIEbattler96_AI.Periphera.Testing.desktop
          appstreamcli validate --no-net packaging/io.github.AUSSIEbattler96_AI.Periphera.Testing.metainfo.xml

  flatpak:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Build bundle and run tests inside the SDK
        env:
          PERIPHERA_BUILD_CHANNEL: testing
        run: bash scripts/build-flatpak.sh
      - name: Smoke test the installed bundle
        run: |
          flatpak install --user --noninteractive dist/periphera-testing.flatpak
          flatpak run --env=QT_QPA_PLATFORM=offscreen --env=PERIPHERA_TESTING=1 --command=python3 io.github.AUSSIEbattler96_AI.Periphera.Testing - <<'PY'
          import sys
          sys.path.insert(0, "/app/lib/periphera")
          from PyQt6.QtWidgets import QApplication
          from PyQt6.QtDBus import QDBusMessage
          from barracuda_gui import Window
          from mousemat import MODELS
          app = QApplication([])
          window = Window(autorefresh=False)
          window.show()
          assert window.windowTitle() == "Periphera Testing"
          assert not window.setup_page.install_button.isEnabled()
          window.navigate("setup")
          app.processEvents()
          window.navigate("mouse")
          window.mouse_page.preview.setChecked(True)
          app.processEvents()
          window.navigate("mousemat")
          window.mat_page.preview.setChecked(True)
          for pid in MODELS:
              window.mat_page.preview_model.setCurrentIndex(window.mat_page.preview_model.findData(pid))
              app.processEvents()
              assert all(not b.isEnabled() for b in window.mat_page.apply_buttons.values())
          assert not window.busy
          window.close()
          PY
      - name: Prepare testing downloads
        run: |
          cp install-permissions.sh 70-barracuda-x-chroma.rules dist/
          cp docs/HOST_SETUP.md docs/MOUSE_MATS.md dist/
          cp docs/TESTING.md hardware_setup.py dist/
          git archive --format=zip --prefix=barracuda-linux/ HEAD -o dist/periphera-source.zip
          cd dist
          sha256sum periphera-testing.flatpak periphera-source.zip install-permissions.sh 70-barracuda-x-chroma.rules HOST_SETUP.md MOUSE_MATS.md TESTING.md hardware_setup.py > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: periphera-testing-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

